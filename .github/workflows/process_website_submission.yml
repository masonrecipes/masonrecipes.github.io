name: Draft Website Recipe Submission

# Turns a website-created recipe-submission issue into a review-only PR.
# The model runs on Cloudflare Workers AI behind the submission Worker's /draft
# endpoint, which accepts only this repository's GitHub OIDC token, so no key is
# stored. See "AI drafting for website submissions" in README.md.

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: website-recipe-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft-recipe:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'recipe-submission') &&
      startsWith(github.event.issue.title, '[Website submission]') &&
      startsWith(github.event.issue.body, '## Website recipe submission') &&
      (github.event.action == 'opened' || github.event.label.name == 'recipe-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    env:
      BRANCH: website-recipe-${{ github.event.issue.number }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Creating an issue with a label fires both opened and labeled; the second run
      # (serialized by the concurrency group) finds the branch and stops here.
      - name: Skip if already drafted
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --silent 2>/dev/null; then
            echo "Branch ${BRANCH} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deployed draft Worker
        if: steps.existing.outputs.skip != 'true'
        env:
          RECIPE_DRAFT_URL: https://mason-recipe-submissions.david-beihl.workers.dev/draft
          INTAKE_OUT_DIR: ${{ runner.temp }}/intake
        run: |
          mkdir -p "$INTAKE_OUT_DIR"
          status="$(curl --connect-timeout 10 --max-time 30 --output /dev/null --silent --write-out '%{http_code}' "$RECIPE_DRAFT_URL" || true)"
          if [[ "$status" != "401" ]]; then
            echo "draft-endpoint-unavailable" > "${INTAKE_OUT_DIR}/failure-reason"
            echo "The draft Worker returned HTTP ${status:-no-response}; expected 401 without a token." >&2
            exit 1
          fi

      # No GitHub token in this step. The issue is read from $GITHUB_EVENT_PATH in code.
      # The OIDC token proves to the Worker that this is the recipes repository's main
      # branch; it is short-lived and minted only for the Worker's audience.
      - name: Draft recipe with the model
        if: steps.existing.outputs.skip != 'true'
        env:
          RECIPE_DRAFT_URL: https://mason-recipe-submissions.david-beihl.workers.dev/draft
          INTAKE_OUT_DIR: ${{ runner.temp }}/intake
        run: |
          set -o pipefail
          RECIPE_DRAFT_TOKEN="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mason-recipe-submissions" | jq --exit-status --raw-output '.value')"
          echo "::add-mask::${RECIPE_DRAFT_TOKEN}"
          export RECIPE_DRAFT_TOKEN
          python .github/scripts/website_recipe.py

      - name: Build site
        if: steps.existing.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          zensical build --clean

      - name: Open pull request
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          INTAKE_OUT_DIR: ${{ runner.temp }}/intake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch --create "$BRANCH"
          git add -- docs/recipes mkdocs.yml docs/authors.md
          git commit --file "${INTAKE_OUT_DIR}/pr-title"
          git push origin "$BRANCH"
          pr_url="$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "$(cat "${INTAKE_OUT_DIR}/pr-title")" \
            --body-file "${INTAKE_OUT_DIR}/pr-body.md")"
          gh issue comment "$ISSUE_NUMBER" --body "A draft recipe page is ready for review: ${pr_url}"

      - name: Comment on failure
        if: failure() && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INTAKE_OUT_DIR: ${{ runner.temp }}/intake
        run: |
          marker="<!-- website-recipe-intake-failed -->"
          # ponytail: one failure comment per issue; a re-label retry that fails again
          # only shows in the Actions run.
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            exit 0
          fi
          reason="$(tr -cd 'a-z-' < "${INTAKE_OUT_DIR}/failure-reason" 2>/dev/null || true)"
          site="$(tr -cd 'a-z0-9.-' < "${INTAKE_OUT_DIR}/failure-site" 2>/dev/null || true)"
          if [[ "$reason" == link-blocked ]]; then
            # The site answered with a bot challenge that no automatic read gets past.
            named="The linked site"
            [[ -n "$site" ]] && named="The linked site, \`${site}\`,"
            message="${named} blocks automatic reading, so no draft was opened. Please copy the ingredients and steps into a comment here, or send the recipe again through the website with them filled in. This submission stays open for manual formatting."
          elif [[ "$reason" == link-* ]]; then
            # The linked page could not be fetched safely or held no recipe.
            message="We could not read the ingredients and steps from the linked page (reason: \`${reason}\`), so no draft was opened. Please add the ingredients and recipe steps as text in a comment here, or send the recipe again through the website with them filled in. This submission stays open for manual formatting."
          elif [[ "$reason" == draft-endpoint-unavailable ]]; then
            message="The recipe drafting Worker did not recognize its protected \`/draft\` endpoint, so no model request was made. Redeploy the Worker, then remove and re-add the \`recipe-submission\` label to retry. This submission stays open for manual formatting."
          else
            message="The automatic recipe draft could not be created (reason: \`${reason:-workflow-error}\`). This submission stays open for manual formatting. To retry, remove and re-add the \`recipe-submission\` label."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "${marker}
          ${message}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
