name: Zensical Preview Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zensical-build:
    name: Zensical build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Alpha releases land every few days: bump this deliberately, never float it.
      - name: Install Zensical
        run: pip install zensical==0.0.63

      - name: Check recipe style
        run: scripts/format-recipes.sh --check

      - name: Build site
        run: zensical build --clean

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: zensical-site
          path: site
          if-no-files-found: error
