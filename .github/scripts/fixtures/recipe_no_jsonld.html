  <h1>Fresh Lemonade</h1>
  <h2>Ingredients</h2>
  <ul>
    <li>6 lemons</li>
    <li>1 cup sugar</li>
    <li>4 cups water</li>
  </ul>
  <h2>Instructions</h2>
  <ol>
    <li>Juice the lemons.</li>
    <li>Stir in sugar and water until dissolved.</li>
